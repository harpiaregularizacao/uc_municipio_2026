<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCs CAATINGA: Fortalecendo a Conservação Municipal</title>
<style>
:root{--bg:#faf7f0;--surf:#fff;--ink:#23201a;--mut:#6b655a;--line:#e6dfcf;--yel:#f5b800;--teal:#1f9aa8;--grn:#4a7f2a;--pur:#8e4a94;--brn:#a85d16;--c1:#4a7f2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1812;--surf:#26221a;--ink:#f3ecdc;--mut:#b0a890;--line:#3b3527;--teal:#46c3d1;--grn:#86b95f;--pur:#c286c8;--brn:#d98a43;--c1:#86b95f}}
:root[data-theme="dark"]{--bg:#1b1812;--surf:#26221a;--ink:#f3ecdc;--mut:#b0a890;--line:#3b3527;--teal:#46c3d1;--grn:#86b95f;--pur:#c286c8;--brn:#d98a43;--c1:#86b95f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;line-height:1.2;margin:0}
header{background:var(--surf);border-bottom:6px solid var(--yel);padding:14px 16px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.wh{background:#fff;border-radius:10px;padding:4px 10px}.wh img{height:64px;display:block}
h1{font-size:clamp(1.1rem,3vw,1.6rem);max-width:560px}
.fluxo{margin:0 0 20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}.fluxo img{width:100%;height:auto;display:block}
.mun{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap}.mun span{font-weight:600;color:var(--mut)}.mun button{padding:8px 22px;border-radius:10px;border:2px solid var(--line);background:var(--surf);color:var(--ink);font:700 1rem "Fraunces",Georgia,serif;cursor:pointer}.mun button[aria-selected="true"]{background:var(--yel);border-color:var(--yel);color:#23201a}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 12px;background:var(--surf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav a{padding:8px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;border:1px solid var(--line)}
nav a[aria-current="page"]{background:var(--teal);border-color:var(--teal);color:#fff}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
section.pg{display:none}section.pg.on{display:block}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:var(--teal);color:#fff;font:600 .95rem inherit;text-decoration:none;border:0;cursor:pointer}
.btn.s{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 10px;font-size:.82rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sum,.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.big{font:700 2.2rem "Fraunces",Georgia,serif;color:var(--teal)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c1)}
.meta,.hint{color:var(--mut);font-size:.88rem}
.prod{background:var(--surf);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;margin-bottom:12px}
.prod>summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.prod>summary::-webkit-details-marker{display:none}
.pn{color:var(--c);font-weight:600;font-size:.88rem}.pt{font:700 1.05rem "Fraunces",Georgia,serif}
.pst{grid-row:1/3;grid-column:2;text-align:right;font-weight:600;font-size:.9rem}.prod .bar{grid-column:1/-1;margin-top:6px}
.ent{border-top:1px solid var(--line);padding:10px 16px}
.en{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ok{color:var(--c1)}
.dr{display:flex;align-items:center;gap:8px;padding:5px 0 5px 14px;flex-wrap:wrap}
.dr .nm{flex:1;min-width:180px;background:none;border:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;padding:0}
.dr .nm.on{color:var(--teal);text-decoration:underline}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink);padding:18px;max-width:560px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
#vw{max-width:1100px;height:calc(100% - 24px);max-height:none;padding:0;display:none;flex-direction:column}#vw[open]{display:flex}
.vh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}.vh strong{flex:1}
#vw iframe{flex:1;border:0;width:100%;background:#fff}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:8px 0}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:var(--grn);color:#fff}td.m{width:44px;text-align:center}td.f{background:#92d050}
.wrap{overflow-x:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fb{display:block;width:100%;padding:18px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:700 1.05rem "Fraunces",Georgia,serif;cursor:pointer;text-align:center}
.fb.on{border-color:var(--grn)}.fb small{display:block;font:400 .8rem "Source Sans 3",sans-serif;color:var(--mut)}
.av{border-left:4px solid var(--yel)}
#sigf,.pf{width:100%;height:75vh;border:1px solid var(--line);border-radius:12px;background:#fff}
li.mp{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}li.mp button.nm{flex:1;text-align:left;background:none;border:0;font:inherit;color:var(--teal);text-decoration:underline;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
</style>
</head>

  td+=d;tt+=n;

 $("acompanhamento").innerHTML='<div class="top"><h2>Acompanhamento das entregas \u2013 '+MN[MUN]+'</h2><a class="btn" href="'+DRIVE+'" target="_blank" rel="noopener">Drive do projeto</a></div><div class="sum"><div class="big">'+Math.round(td/tt*100)+'%</div><div class="meta">'+td+' de '+tt+' entregas realizadas. Documentos só contam quando o PDF finalizado tem link; o Produto 3 conta quando as datas de início e fim são informadas.</div><div class="bar" style="margin-top:10px"><i style="width:'+td/tt*100+'%"></i></div></div>'+h}

 var h='<h2 style="margin-bottom:12px">Cronograma de execução</h2><div class="wrap"><table><tr><th rowspan="2">Produto</th><th rowspan="2">Descrição</th><th colspan="7">Mês (iniciando em nov de 2026)</th></tr><tr>'+MES.map(function(m,i){return'<th title="'+m+'">'+(i+1)+'<br><small>'+m+'</small></th>'}).join("")+'</tr>';

 $("sig").innerHTML='<div class="top"><h2>SIG do projeto</h2><button class="btn s" data-e="sig" data-t="sig" data-l="Página HTML do SIG">'+(u?'Alterar link do SIG':'Carregar link do SIG')+'</button></div>'+(u?'<iframe id="sigf" title="SIG do projeto" src="'+esc(u)+'"></iframe><p class="hint"><a href="'+esc(u)+'" target="_blank" rel="noopener">Abrir o SIG em nova aba</a></p>':'<div class="card hint">Nenhum SIG carregado. Use o botão acima para informar o link da página HTML do SIG.</div>')}
function rMapas(){var u=url("mapasdir"),MP=ALLMP.filter(function(m){return m.mun==MUN});
 $("mapas").innerHTML='<div class="top"><h2>Mapas</h2><div><button class="btn s" data-e="mapasdir" data-t="pasta" data-l="Pasta de mapas no Google Drive">'+(u?'Alterar pasta':'Carregar pasta de mapas')+'</button> '+(u?'<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">Abrir pasta</a> ':'')+'<button class="btn" data-add="1">Adicionar mapa (PDF)</button></div></div><div class="card">'+(MP.length?'<ul>'+MP.map(function(m){return'<li class="mp"><button class="nm" data-om="'+m.id+'">'+esc(m.title)+'</button><button class="btn s" data-dm="'+m.id+'" aria-label="Remover '+esc(m.title)+'">Remover</button></li>'}).join("")+'</ul>':'<span class="hint">Nenhum mapa listado ainda.</span>')+'</div>'}
async function rAvisos(){
 var AV=ALLAV.filter(function(a){return a.mun==MUN}),ids=[];AV.forEach(function(a){if(a.uid&&ids.indexOf(a.uid)<0)ids.push(a.uid)});
 if(user&&ids.length){try{var ps=await user.profiles(ids);ids.forEach(function(i){NM[i]=ps[i]&&ps[i].name})}catch(e){}}
 $("avisos").innerHTML='<h2 style="margin-bottom:10px">Quadro de avisos</h2><div class="card"><textarea id="avt" rows="3" maxlength="1000" placeholder="Deixe um recado para a equipe do projeto"></textarea><div class="acts"><button class="btn" id="avb">Publicar aviso</button></div><p class="hint" id="ave"></p></div>'+(AV.length?AV.map(function(a){return'<div class="card av"><div class="meta">'+esc(NM[a.uid]||"Membro do projeto")+' · '+new Date(a.ts).toLocaleString("pt-BR")+'</div><div style="white-space:pre-wrap">'+esc(a.text)+'</div>'+(a.uid&&a.uid===uid?'<button class="btn s" style="margin-top:8px" data-da="'+a.id+'">Apagar</button>':'')+'</div>'}).join(""):'<p class="hint">Nenhum aviso ainda.</p>')}

 PG.forEach(function(p){$(p[0]).classList.toggle("on",p[0]===c)});$("fluxo").style.display=c==="acompanhamento"?"":"none";R[c]()}
function guard(f){if(!db){$("warn").hidden=false;return false}return true}
function edit(k,t,l){ed={k:MUN+"_"+k};$("edt").textContent=l;$("edn").style.display="none";$("edh").textContent=t=="w"?"Cole o link do arquivo Word no Google Drive.":t=="sig"?"Cole o link da página HTML (SIG ou painel).":t=="pasta"?"Cole o link da pasta do Google Drive.":"Cole o link do PDF no Google Drive (compartilhado com quem for acessar).";$("edi").value=url(k)||"";$("edr").style.display=url(k)?"":"none";$("ed").showModal()}
function open_(k,t,title){var u=url(k);if(!u){edit(k,t,title||"Carregar link");return}
 if(t=="pasta"||t=="w"){window.open(u,"_blank","noopener");return}
 $("vt").textContent=title||"Documento";$("vo").href=u;$("vf").src=embed(u,t=="pdf");$("vw").showModal()}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.e){if(guard())edit(d.e,d.t,d.l||"Carregar link")}
 else if(d.o)open_(d.o,d.t,b.textContent);
 else if(d.add){if(!guard())return;ed={k:null};$("edt").textContent="Adicionar mapa (PDF)";$("edh").textContent="Informe o nome e o link do PDF no Google Drive.";$("edn").style.display="";$("edn").value="";$("edi").value="";$("edr").style.display="none";$("ed").showModal()}
 else if(d.campo){if(!guard())return;var a=$("cin").value,z=$("cfi").value;if(a&&z&&z<a){$("cer").textContent="A data de fim não pode ser anterior à de início.";return}db.collection("links").doc(MUN+"_campo").set({ini:a,fim:z}).catch(function(){$("cer").textContent="Não foi possível salvar."})}
 else if(d.mun){MUN=d.mun;try{localStorage.setItem("ucs-mun",MUN)}catch(e){}render()}
 else if(d.om){var m=ALLMP.filter(function(x){return x.id==d.om})[0];$("vt").textContent=m.title;$("vo").href=m.url;$("vf").src=embed(m.url,true);$("vw").showModal()}
 else if(d.dm){db.collection("mapas").doc(d.dm).delete().catch(function(){})}
 else if(d.da){db.collection("avisos").doc(d.da).delete().catch(function(){})}
 else if(b.id=="avb"){if(!guard())return;var t=$("avt").value.trim();if(!t)return;var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);db.collection("avisos").doc(id).set({uid:uid,mun:MUN,text:t,ts:Date.now()}).catch(function(){$("ave").textContent="Não foi possível publicar. Verifique se você tem permissão de edição no projeto."})}
});

 if(ed.k===null){var n=$("edn").value.trim();if(!v||!n){$("edh").textContent="Informe o nome e o link.";return}var id=Date.now().toString(36);db.collection("mapas").doc(id).set({title:n,url:v,mun:MUN,ts:Date.now()}).catch(function(){})}
 else if(v)db.collection("links").doc(ed.k).set({url:v}).catch(function(){});else db.collection("links").doc(ed.k).delete().catch(function(){});
 $("ed").close()};
$("edr").onclick=function(){db.collection("links").doc(ed.k).delete().catch(function(){});$("ed").close()};

render();
(async function(){
 try{var C=window.claude;if(!C||!C.use)throw 0;db=await C.use("db");user=await C.use("user");if(user)uid=await user.id()}catch(e){}
 if(!db){db=(function(){var K='ucs-local-db',S={},Ls={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}function snap(n){var o=S[n]||{};return{docs:Object.keys(o).map(function(i){return{id:i,data:function(){return o[i]}}})}}function fire(n){(Ls[n]||[]).forEach(function(f){f(snap(n))})}return{collection:function(n){return{doc:function(i){return{set:function(d){(S[n]=S[n]||{})[i]=d;save();fire(n);return Promise.resolve()},delete:function(){if(S[n])delete S[n][i];save();fire(n);return Promise.resolve()}}},onSnapshot:function(f){(Ls[n]=Ls[n]||[]).push(f);f(snap(n))}}}}})();uid='local';NM.local='Você';$('warn').hidden=false}
 db.collection("links").onSnapshot(function(s){L={};s.docs.forEach(function(d){L[d.id]=d.data()});render("acompanhamento");render("fotos");render("sig");render("socio");render("queim");render("mapas")},function(){});
 db.collection("mapas").onSnapshot(function(s){ALLMP=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return a.ts-b.ts});render("mapas")},function(){});
 db.collection("avisos").onSnapshot(function(s){ALLAV=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return b.ts-a.ts});render("avisos")},function(){});
})();
